x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    container_name: rag-api
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HF_HOME: /models/hf
      HF_HUB_CACHE: /app/hf-cache/hub
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY required in prod}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RAG_ADMIN_API_KEY: ${RAG_ADMIN_API_KEY:?RAG_ADMIN_API_KEY required in prod}
      RAG_CORS_ORIGINS: ${RAG_CORS_ORIGINS:?RAG_CORS_ORIGINS required in prod (comma-separated allowlist)}
      RAG_RATE_LIMIT_PER_MIN: ${RAG_RATE_LIMIT_PER_MIN:-120}
      RAG_ADMIN_RATE_LIMIT_PER_MIN: ${RAG_ADMIN_RATE_LIMIT_PER_MIN:-20}
      RAG_DATA_DIR: /app/resource data
    volumes:
      - hf_cache:/app/hf-cache
      - "./resource data:/app/resource data"
    ports:
      - "127.0.0.1:8012:8012"  # 仅绑定回环：公网暴露应经反向代理 + TLS
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=10).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8g

  db:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    # 生产不暴露 5432 到宿主机：容器网络内 api 可达即可
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  pgdata:
  hf_cache:
