services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    container_name: rag-api
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag_local_dev}@db:5432/${POSTGRES_DB:-rag}
      HF_HOME: /models/hf
      HF_HUB_CACHE: /app/hf-cache/hub
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RAG_ADMIN_API_KEY: ${RAG_ADMIN_API_KEY:-}
      RAG_DATA_DIR: /app/resource data
    volumes:
      - hf_cache:/app/hf-cache
      - "./resource data:/app/resource data"
    ports:
      - "8012:8012"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=10).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  pgdata:
  hf_cache:
